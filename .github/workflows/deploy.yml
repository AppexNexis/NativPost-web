name: Deploy NativPost to IONOS VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Next.js (Standalone)
        run: npm run build
        env:
          CI: false
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
          NEXT_PUBLIC_CONTENTFUL_SPACE_ID: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_SPACE_ID }}
          NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_ACCESS_TOKEN }}
          NEXT_PUBLIC_CONTENTFUL_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_ENVIRONMENT }}
          NEXT_PUBLIC_CONTENTFUL_PREVIEW_TOKEN: ${{ secrets.NEXT_PUBLIC_CONTENTFUL_PREVIEW_TOKEN }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}
          NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AFFILIATE_ADMIN_SECRET: ${{ secrets.AFFILIATE_ADMIN_SECRET }}
          AFFILIATE_NOTIFY_EMAIL_1: ${{ secrets.AFFILIATE_NOTIFY_EMAIL_1 }}
          AFFILIATE_NOTIFY_EMAIL_2: ${{ secrets.AFFILIATE_NOTIFY_EMAIL_2 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          WHATSAPP_NOTIFY_NUMBER: ${{ secrets.WHATSAPP_NOTIFY_NUMBER }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}

      - name: 📤 Deploy Standalone Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: '.next/standalone/'
          target: '/var/www/nativpost-app'
          strip_components: 2
          rm: true

      - name: 📤 Deploy Static Assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: '.next/static/'
          target: '/var/www/nativpost-app/.next/static'
          strip_components: 2
          rm: true

      - name: 📤 Deploy Public Folder
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: 'public/'
          target: '/var/www/nativpost-app/public'
          strip_components: 1
          rm: true

      # ── Write runtime .env so PM2 has all secrets at runtime ──
      - name: 🔐 Write runtime .env to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          AFFILIATE_ADMIN_SECRET: ${{ secrets.AFFILIATE_ADMIN_SECRET }}
          AFFILIATE_NOTIFY_EMAIL_1: ${{ secrets.AFFILIATE_NOTIFY_EMAIL_1 }}
          AFFILIATE_NOTIFY_EMAIL_2: ${{ secrets.AFFILIATE_NOTIFY_EMAIL_2 }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          WHATSAPP_NOTIFY_NUMBER: ${{ secrets.WHATSAPP_NOTIFY_NUMBER }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: AFFILIATE_ADMIN_SECRET,AFFILIATE_NOTIFY_EMAIL_1,AFFILIATE_NOTIFY_EMAIL_2,RESEND_API_KEY,FROM_EMAIL,WHATSAPP_NOTIFY_NUMBER,CALLMEBOT_API_KEY,NEXT_PUBLIC_SITE_URL
          script: |
            printf 'AFFILIATE_ADMIN_SECRET=%s\n' "$AFFILIATE_ADMIN_SECRET" > /var/www/nativpost-app/.env.production
            printf 'AFFILIATE_NOTIFY_EMAIL_1=%s\n' "$AFFILIATE_NOTIFY_EMAIL_1" >> /var/www/nativpost-app/.env.production
            printf 'AFFILIATE_NOTIFY_EMAIL_2=%s\n' "$AFFILIATE_NOTIFY_EMAIL_2" >> /var/www/nativpost-app/.env.production
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> /var/www/nativpost-app/.env.production
            printf 'FROM_EMAIL=%s\n' "$FROM_EMAIL" >> /var/www/nativpost-app/.env.production
            printf 'WHATSAPP_NOTIFY_NUMBER=%s\n' "$WHATSAPP_NOTIFY_NUMBER" >> /var/www/nativpost-app/.env.production
            printf 'CALLMEBOT_API_KEY=%s\n' "$CALLMEBOT_API_KEY" >> /var/www/nativpost-app/.env.production
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "$NEXT_PUBLIC_SITE_URL" >> /var/www/nativpost-app/.env.production
            printf 'NODE_ENV=production\n' >> /var/www/nativpost-app/.env.production
            chmod 600 /var/www/nativpost-app/.env.production

      - name: 🚀 Start / Reload via PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/nativpost-app
            export $(grep -v '^#' .env.production | xargs)
            if pm2 describe nativpost-web > /dev/null 2>&1; then
              pm2 reload nativpost-web --update-env
            else
              pm2 start server.js --name nativpost-web -- --port 3000
              pm2 save
            fi
          # script: |
          #   cd /var/www/nativpost-app

          #   # Load .env.production into PM2's environment
          #   export $(cat .env.production | xargs)

          #   if pm2 describe nativpost-web > /dev/null 2>&1; then
          #     pm2 reload nativpost-web --update-env
          #   else
          #     pm2 start server.js --name nativpost-web -- --port 3000
          #     pm2 save
          #   fi

      - name: ✅ Done
        run: echo "🎉 https://nativpost.com deployed successfully"
